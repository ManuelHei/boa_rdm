defaults:
  - dataset: df_db_mp2

_target_: boa.data.datamodule.DataModule

# No split ships with df_db_mp2, unlike df_db_pbe. Ours is disjoint by *geometry*,
# not merely by index: QM9 holds near-duplicate structures, and the shipped
# df_db_pbe split let three of them straddle a boundary. Duplicate groups are
# assigned as a unit here, so 0 groups cross a split.
split_file: ${paths.data_dir}/${data.dataset_name}/datasplits.json

batch_size:
  train: 8
  val: 8
  test: 8

num_workers:
  train: 8
  val: 8
  test: 8

dataloader_kwargs:
  follow_batch: ["coeffs", "atomic_numbers"]
  # gamma is a different size for every molecule (18-148 AOs), so it cannot be
  # stacked; the module pads and masks it.
  list_keys: ["rdm"]
