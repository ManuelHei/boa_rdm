_target_: boa.model.net.boa_net.BOA

basis_info: ${model.basis_info}

boa_stack:
  _target_: boa.model.net.boa_block_stack.BoaBlockStack
  block: 
    _target_: boa.model.net.boa_block.BoaBlock
    _partial_: true
  n_blocks: 4
  basis_info: ${model.basis_info}
  hidden_channels: 32

num_orbitals: 8
direct_gs_prediction: True

# Seed the l=1 AO slots with a per-atom pseudovector, deliberately breaking
# parity (rotation equivariance is untouched). Off by default: with it off the
# model is exactly O(3)-equivariant, which forces the out-of-plane p
# coefficients of a PLANAR molecule to zero -- 42% of ||D||_F on the H2O set,
# and unreachable at any capacity. See boa.model.net.boa_net.AxialSeed.
axial_seed: False

initial_guess_module:
  _target_: boa.model.net.boa_net.ReducedEdgeEmbedding
  basis_info: ${model.basis_info}
  channels: 1