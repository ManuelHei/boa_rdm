_target_: boa.model.rdm_module.RDMLightningModule

# mse | mae | huber, applied elementwise to the density matrix; or `function`,
# the squared L2 distance between the density matrices as functions,
#   int dr dr' (gamma - gamma_pred)^2 = tr(dD S dD S),
# which measures the error in the metric the basis induces rather than in the
# coordinates it is written in. `function` needs the un-zeroed overlap on the
# batch and averages over molecules rather than elements.
criterion: mse
huber_delta: 1.0

# Only the symmetric part of D is physical, and the reference is symmetric.
symmetrize: true

# Output scale on the predicted matrix.
scale_factor: 1.0

# Batch key holding the reference density matrix, (n_ao, n_ao) per sample in
# the AO ordering of basis_info.basis_dict.
target_key: rdm

# tr(D S) as a sanity metric. Needs AddMessagePassingMatrix with
# remove_diagonal: False, otherwise the trace is not the electron count.
log_electron_count: false

log_train_metrics_interval: 10

# Log the reference matrix, the prediction and their difference as TensorBoard
# images at the start of each validation epoch (first molecule of the batch).
# Target and prediction share a colour scale; the error gets its own.
log_matrix_images: true
log_matrix_images_every_n_val: 1

# Sorted eigenvalues of S^{1/2} γ S^{1/2} for the same molecule and cadence
# as the heatmaps. Predicted vs reference, with lines at 0 and 2.
log_occupation_figures: true

dft_basis_set: ${data.basis_info.basis}
dft_wt_aug: ${data.basis_info.even_tempered}

basis_info: ${data.basis_info}

defaults:
  - net: boa
