defaults:
  - transform: df_db

_target_: boa.data.dataset.DfDbCumulantDataset

path: ${paths.data_dir}/${data.dataset_name}
basis_info: ${data.basis_info}
aux_basis: ${data.aux_basis}
rdm_key: gamma
cumulant_key: gamma2cum
# `energycum_df` is read automatically, for the reference-consistency check.
extra_props: ["ke", "dipole"]
# The aux Coulomb metric (A|B), needed by the `coulomb` cumulant loss and by the
# cumulant energy metric. One int2c2e per molecule, a few ms.
attach_metric: true
