_target_: boa.model.net.helm_net.HelmRDM

basis_info: ${model.basis_info}

# Widths. HELM's own configs run 128 channels; 64 keeps a water run small
# enough to iterate on and is already far wider than the BOA stack (32).
sphere_channels: 64
hidden_channels: 64
edge_channels: 64
num_distance_basis: 64
num_layers: 3

# lmax defaults to 2*max(l) of the basis, the lowest degree that can represent
# every shell-pair block (4 for a basis with d functions). mmax follows lmax.
lmax: null
mmax: null

# The gaussian expansion must span the graph, or the longest edges carry no
# radial information at all: GaussianSmearing places its centres on [0, cutoff],
# so past cutoff + a width every feature underflows to exactly zero -- not a flat
# tail, zero. At the inherited 6.0 against the 8.0 A graph, 2.9% of edges fell
# outside the range and 1.9% had identically-zero radial features while still
# contributing through their direction.
#
# The 6.0 dated from the 3.0 A graph (the old comment called it "roughly twice
# the graph cutoff"); the requirement is coverage, not a multiple, so this now
# tracks `edge_radius_ang` in the transform. Going wider would only spend basis
# functions on distances the graph never produces.
gaussian_cutoff: 8.0
gaussian_width: 1.0
edge_index_key: edge_index

# 'triton' is the fused Wigner kernel; 'torch' is the portable path.
wigner_backend: torch
norm_type: rms_norm_sh
