# Density-matrix prediction with the HELM backbone. Identical to `rdm.yaml`
# in loss, metrics and logging -- only the net and the module that reads it
# differ, so runs are directly comparable on rel_fro.
_target_: boa.model.helm_rdm_module.HelmRDMLightningModule

# mse | mae | huber, applied elementwise to the density matrix; or `function`,
# the squared L2 distance between the density matrices as functions,
#   int dr dr' (gamma - gamma_pred)^2 = tr(dD S dD S),
# which measures the error in the metric the basis induces rather than in the
# coordinates it is written in. `function` needs the un-zeroed overlap on the
# batch and averages over molecules rather than elements.
criterion: mse
huber_delta: 1.0

# Only the symmetric part of D is physical, and the reference is symmetric.
symmetrize: true

# Output scale on the predicted matrix.
scale_factor: 1.0

# Per-element prior on the on-site (diagonal) blocks: the rotation-invariant
# l=0 part of each same-l shell pair, measured on the training split and added
# to the prediction (`boa.model.onsite`). A carbon 1s is doubly occupied in
# every molecule; without this the net has to reproduce that constant, and the
# residual that actually carries the chemistry is what it stops resolving.
#   false / null  off
#   true          measure it over the training split and cache it beside the dataset
#   <path>        load a prior written earlier
# It is a bias on the *prediction*, not a shift of the target, so the model
# output stays a density matrix and nothing downstream needs un-shifting.
onsite_bias: false
# Molecules the measurement pass reads; 0 means the whole training split. The
# mean over ~10 000 atoms is already converged to a few parts in 10^4 (the pass
# logs its standard error, so the choice is checkable rather than assumed).
onsite_bias_max_molecules: 2000
# ... but the cap is not allowed to starve a rare element: the pass keeps
# reading until every element has at least this many atoms, or the split ends.
onsite_bias_min_atoms: 32

# Batch key holding the reference density matrix, (n_ao, n_ao) per sample in
# the AO ordering of basis_info.basis_dict.
target_key: rdm

# tr(D S) as a sanity metric. Needs AddMessagePassingMatrix with
# remove_diagonal: False, otherwise the trace is not the electron count.
log_electron_count: false

log_train_metrics_interval: 10

# Log the reference matrix, the prediction and their difference as TensorBoard
# images at the start of each validation epoch (first molecule of the batch).
# Target and prediction share a colour scale; the error gets its own.
log_matrix_images: true
log_matrix_images_every_n_val: 1

# Sorted eigenvalues of S^{1/2} γ S^{1/2} for the same molecule and cadence
# as the heatmaps. Predicted vs reference, with lines at 0 and 2.
# How many molecules the figures cover. One is a poor sample of a set
# spanning 3-27 atoms; the first val molecule is 4-atom ammonia.
log_matrix_images_n_molecules: 3
log_occupation_figures: true

dft_basis_set: ${data.basis_info.basis}
dft_wt_aug: ${data.basis_info.even_tempered}

basis_info: ${data.basis_info}

defaults:
  - net: helm
