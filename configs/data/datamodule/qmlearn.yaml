defaults:
  - dataset: qmlearn

# The plain DataModule, not ProbeDataModule: there is no grid here, so there is
# no n_probe to configure. ProbeDataModule would force a meaningless n_probe
# node and route through a branch that raises when it is 0.
_target_: boa.data.datamodule.DataModule

# No datasplits.json ships with the db; DataModule.setup falls back to a 10%
# validation holdout (seeded), reused as the test split.
split_file: null

batch_size:
  train: 8
  val: 8
  test: 8

num_workers:
  train: 8
  val: 8
  test: 8

dataloader_kwargs:
  follow_batch: ["coeffs", "atomic_numbers"]
  list_keys: []
