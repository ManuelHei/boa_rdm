# @package _global_

# First density-matrix training run: 1000 geometries of H2O from the QMLearn
# hackathon db, gamma as the target, no grid anywhere.

defaults:
  - override /data: qmlearn
  - override /model: rdm
  - override /trainer: default
  # Grid-free variant: the default overrides set data.datamodule.n_probe, which
  # the plain DataModule has no key for, so merging them raises ConfigKeyError.
  - override /pre_training_overrides: grid_free

name: h2o_rdm

# Pre-training is ON despite the warm start being a poor *predictor*: it is
# capped at 33% of ||D||_F^2 (rel_fro floor 0.816) while the mean-gamma constant
# reaches 0.043. The reason to keep it is conditioning, not accuracy. D is a
# product of two learned factors, sum_r a (x) b, so scale errors compound
# quadratically, and the first run without it diverged to rel_fro 101 in
# fourteen steps. Pre-training puts the initial-guess channel at a calibrated
# scale before that product can run away.
initial_guess_pre_training_steps: 1000

trainer:
  max_steps: 20000

# Baseline to beat: rel_fro = 0.0428, from predicting the training-set mean
# gamma. The targets barely move across these geometries (||gamma||_F spans
# 3.174-3.238), so any rel_fro above that is worse than a constant predictor.
# Read rel_fro/val against 0.0428, not against zero.
