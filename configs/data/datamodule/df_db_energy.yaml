defaults:
  - dataset: df_db_energy

_target_: boa.data.datamodule.DataModule

# The split ships with the generated set, not the source: these matrices came
# from a model trained on the source's train split, so validating the energy
# model on those molecules would leak through the density matrix.
split_file: ${paths.data_dir}/${data.dataset_name}/datasplits.json

batch_size:
  train: 8
  val: 8
  test: 8

num_workers:
  train: 8
  val: 8
  test: 8

dataloader_kwargs:
  follow_batch: ["coeffs", "atomic_numbers"]
  # Both matrices vary in size per molecule and cannot be stacked: `rdm` is the
  # reference, `rdm_pred` is the energy model's input.
  list_keys: ["rdm", "rdm_pred"]
