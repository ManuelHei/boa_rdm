defaults:
  - datamodule: df_db_mp2

dataset_name: df_db_mp2

# Same basis, elements and AO ordering as df_db_pbe, so the union shell layout,
# `max_basis_dim` 14 and `lmax` 4 all carry over unchanged. The *target* is what
# differs: an MP2 one-particle density matrix rather than a Kohn-Sham one.
basis_info:
  _target_: boa.data.basis_info.BasisInfo.from_atomic_numbers_with_even_tempered_basis
  basis: '6-31g*'
  atomic_numbers: [1, 6, 7, 8, 9]
  beta: None
  even_tempered: false
  uncontracted: false
